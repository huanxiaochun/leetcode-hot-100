<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1. 两数之和</title>
<style>
  /* 亮色主题 */
  :root {
    color-scheme: light;
    --bg: #f4f5f7; --card: #fff; --text: #1d1d1f; --muted: #86868b; --line: #e5e5ea;
    --blue: #2f6bff; --blue-soft: #e8efff;
    --green: #16a34a; --green-soft: #dcfce7;
    --amber: #d97706; --amber-soft: #fef3c7;
    --inset: #f4f5f7; --code-bg: #1e1e2e; --code-text: #cdd6f4; --code-hl: rgba(137, 180, 250, .18);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1480px; margin: 0 auto; padding: 36px 32px 48px; }

  /* 左：演示  右：代码 */
  .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .side, .main-col { display: flex; flex-direction: column; gap: 24px; }
  .side { position: sticky; top: 24px; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } .side { position: static; } }
  .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; }

  /* 头部 */
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 34px; margin: 0; letter-spacing: -.5px; }
  .pill { font-size: 15px; padding: 4px 12px; border-radius: 999px; font-weight: 600; }
  .pill.easy { background: var(--green-soft); color: var(--green); }
  .pill.cat { background: var(--blue-soft); color: var(--blue); }
  header a { margin-left: auto; color: var(--muted); font-size: 16px; text-decoration: none; }
  header a:hover { color: var(--blue); }
  .idea { margin: 14px 0 24px; font-size: 22px; color: var(--muted); }
  .idea b { color: var(--text); }

  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 32px; }
  .card.player { padding: 24px; }
  .card.code { padding: 0; overflow: hidden; }

  /* 工具栏：示例分段切换 + 自定义输入 */
  .toolbar { display: flex; gap: 12px; flex-direction: column; align-items: flex-start; margin-bottom: 28px; }
  .seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--inset); }
  .seg button {
    font: inherit; font-size: 16px; font-weight: 600; padding: 8px 18px; border: none; border-radius: 9px;
    background: transparent; color: var(--muted); cursor: pointer; transition: all .2s;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .field {
    width: 100%; display: flex; align-items: center; height: 48px; padding: 0 6px 0 16px;
    border-radius: 12px; background: var(--inset); border: 2px solid transparent; transition: border-color .2s;
  }
  .field:focus-within { border-color: var(--blue); background: var(--card); }
  .field.bad { border-color: #ef4444; }
  .field label { font-size: 14px; color: var(--muted); font-weight: 600; margin-right: 8px; }
  .field input {
    font: 18px "JetBrains Mono", "SF Mono", Menlo, monospace; border: none; outline: none;
    background: transparent; color: var(--text); min-width: 0;
  }
  .field input#numsIn { flex: 1; }
  .field input#tIn { width: 56px; }
  .field .sep { width: 1px; height: 22px; background: var(--line); margin: 0 14px; }
  .field .go {
    font: inherit; font-size: 15px; font-weight: 600; height: 36px; padding: 0 14px; margin-left: 6px;
    border: none; border-radius: 9px; background: var(--blue); color: #fff; cursor: pointer;
  }

  /* 舞台 */
  .stage { display: flex; flex-direction: column; gap: 20px; }
  .label { font-size: 15px; color: var(--muted); margin-bottom: 14px; font-weight: 600; }

  .array { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 30px; }
  .cell { position: relative; text-align: center; }
  .box {
    width: 72px; height: 72px; border-radius: 16px; display: grid; place-items: center;
    font-size: 28px; font-weight: 700; background: var(--inset); border: 2.5px solid transparent;
    transition: all .35s cubic-bezier(.2,.8,.2,1);
  }
  .idx { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .arrow {
    position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    color: var(--blue); font-weight: 700; font-size: 18px; opacity: 0; transition: opacity .2s;
  }
  .cell.past .box { opacity: .4; }
  .cell.cur .box { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); transform: translateY(-6px); }
  .cell.cur .arrow { opacity: 1; }
  .cell.hit .box { border-color: var(--green); background: var(--green-soft); color: var(--green); transform: translateY(-6px); }

  .need { margin-top: 16px; font-size: 24px; min-height: 40px; }
  .need .v {
    display: inline-block; min-width: 52px; text-align: center; padding: 2px 14px; border-radius: 12px;
    background: var(--amber-soft); color: var(--amber); font-weight: 700; margin-left: 6px;
  }

  /* 哈希表 */
  .map { display: flex; flex-wrap: wrap; gap: 12px; min-height: 64px; }
  .kv {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-radius: 14px; background: var(--inset); font-size: 22px; font-weight: 600;
    border: 2.5px solid transparent; transition: all .3s;
  }
  .kv i { font-style: normal; color: var(--muted); font-size: 18px; }
  .kv span:last-child { color: var(--muted); font-size: 18px; }
  .kv.new { animation: pop .4s cubic-bezier(.2,.8,.2,1); border-color: var(--blue); }
  .kv.hit { border-color: var(--green); background: var(--green-soft); color: var(--green); }
  .kv.hit span:last-child { color: var(--green); }
  .map .empty { color: var(--muted); font-size: 18px; padding: 10px 4px; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }

  /* 状态 */
  .status {
    padding: 18px 22px; border-radius: 14px; font-size: 22px; font-weight: 600;
    background: var(--inset); min-height: 70px; display: flex; align-items: center; gap: 12px;
  }
  .status.miss { background: var(--amber-soft); color: var(--amber); }
  .status.ok { background: var(--green-soft); color: var(--green); }

  /* 控制栏 */
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .btn {
    width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--inset); color: var(--text); display: grid; place-items: center;
    transition: background .2s, color .2s;
  }
  .btn svg { width: 20px; height: 20px; }
  .btn:hover:not(:disabled) { background: var(--blue-soft); color: var(--blue); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.play { width: 56px; background: var(--blue); color: #fff; }
  .btn.play:hover { background: var(--blue); color: #fff; filter: brightness(1.08); }
  .btn:focus-visible, .seg button:focus-visible, .go:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .progress { flex: 1; height: 6px; border-radius: 3px; background: var(--inset); overflow: hidden; margin-left: 10px; }
  .progress div { height: 100%; background: var(--blue); transition: width .3s; }
  .count { color: var(--muted); font-size: 16px; min-width: 56px; text-align: right; }

  /* 代码 */
  pre {
    margin: 0; padding: 24px 0; background: var(--code-bg); color: var(--code-text);
    border-radius: 0; font: 17px/1.8 "JetBrains Mono", "SF Mono", Menlo, monospace; overflow-x: auto;
  }
  pre .l { display: block; padding: 0 24px; border-left: 4px solid transparent; transition: background .2s; }
  pre .l.on { background: var(--code-hl); border-left-color: #89b4fa; }
  .k { color: #cba6f7; } .t { color: #f9e2af; } .c { color: #6c7086; }

  /* 要点 */
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 760px) { .facts { grid-template-columns: 1fr; } }
  .fact { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 18px 24px; }
  .fact .big { font-size: 26px; font-weight: 700; }
  .fact .sub { color: var(--muted); font-size: 16px; margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>1. 两数之和</h1>
    <span class="pill easy">简单</span>
    <span class="pill cat">哈希</span>
    <a href="https://leetcode.cn/problems/two-sum/" target="_blank" rel="noopener">LeetCode ↗</a>
  </header>
  <p class="idea">边走边记，每到一个数 <b>x</b>，就查 <b>target − x</b> 之前有没有出现过。</p>

  <div class="layout">
  <div class="main-col">
  <section class="card">
    <div class="toolbar">
      <div class="seg" id="seg" role="tablist" aria-label="示例"></div>
      <form class="field" id="field">
        <label for="numsIn">nums</label><input id="numsIn" autocomplete="off">
        <span class="sep"></span>
        <label for="tIn">target</label><input id="tIn" autocomplete="off">
        <button class="go" type="submit">运行</button>
      </form>
    </div>

    <div class="stage">
      <div>
        <div class="label">nums</div>
        <div class="array" id="array"></div>
        <div class="need mono" id="need"></div>
      </div>
      <div>
        <div class="label">哈希表 seen &nbsp;值 → 下标</div>
        <div class="map mono" id="map"></div>
      </div>
    </div>

  </section>
  <div class="facts">
    <div class="fact"><div class="big mono">O(n)</div><div class="sub">时间，一次遍历</div></div>
    <div class="fact"><div class="big mono">O(n)</div><div class="sub">空间，哈希表</div></div>
    <div class="fact"><div class="big">先查后存</div><div class="sub">避免自己和自己配对</div></div>
  </div>
  </div>

  <div class="side">
  <section class="card player">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="controls">
      <button class="btn" id="reset" aria-label="重置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button class="btn" id="prev" aria-label="上一步"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="btn play" id="play" aria-label="播放"></button>
      <button class="btn" id="next" aria-label="下一步"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="progress"><div id="bar"></div></div>
      <span class="count mono" id="count"></span>
    </div>
  </section>
  <section class="card code">
    <pre id="code"></pre>
  </section>

  </div>
  </div>
</main>

<script>
(() => {
  const CODE = [
    '<span class="t">vector</span>&lt;<span class="t">int</span>&gt; twoSum(<span class="t">vector</span>&lt;<span class="t">int</span>&gt;&amp; nums, <span class="t">int</span> target) {',
    '    <span class="t">unordered_map</span>&lt;<span class="t">int</span>, <span class="t">int</span>&gt; seen;',
    '    <span class="k">for</span> (<span class="t">int</span> i = 0; i &lt; nums.size(); ++i) {',
    '        <span class="t">int</span> need = target - nums[i];',
    '        <span class="k">if</span> (seen.count(need))',
    '            <span class="k">return</span> {seen[need], i};',
    '        seen[nums[i]] = i;  <span class="c">// 先查后存</span>',
    '    }',
    '    <span class="k">return</span> {};',
    '}',
  ];
  const EXAMPLES = [
    [[2, 7, 11, 15], 9],
    [[3, 2, 4], 6],
    [[3, 3], 6],
    [[1, 5, 8, 4, 10, 7], 11],
  ];

  const $ = id => document.getElementById(id);
  let nums, target, steps, cur, timer = null;

  // 预生成每一步的快照
  function build() {
    const s = [], map = [];
    const snap = () => map.map(e => ({ ...e }));
    s.push({ i: -1, map: [], line: 1, msg: '从左往右遍历' });
    for (let i = 0; i < nums.length; i++) {
      const need = target - nums[i];
      s.push({ i, need, map: snap(), line: 3, msg: `${nums[i]} 需要 ${need}` });
      const hit = map.find(e => e.k === need);
      if (hit) {
        s.push({ i, need, map: snap(), line: 5, hitK: need, found: [hit.v, i], kind: 'ok',
          msg: `✓ 找到 ${need}，答案 [${hit.v}, ${i}]` });
        return s;
      }
      s.push({ i, need, map: snap(), line: 4, kind: 'miss', msg: `表里没有 ${need}` });
      const ex = map.find(e => e.k === nums[i]);
      ex ? (ex.v = i) : map.push({ k: nums[i], v: i });
      s.push({ i, map: snap(), line: 6, newK: nums[i], msg: `存入 ${nums[i]} → ${i}` });
    }
    s.push({ i: nums.length, map: snap(), line: 8, msg: '无解' });
    return s;
  }

  function render() {
    const st = steps[cur];
    $('array').innerHTML = nums.map((v, k) => {
      const c = st.found?.includes(k) ? 'hit' : k === st.i ? 'cur' : k < st.i ? 'past' : '';
      return `<div class="cell ${c}"><span class="arrow">i</span><div class="box mono">${v}</div><div class="idx mono">${k}</div></div>`;
    }).join('');
    $('need').innerHTML = st.need !== undefined ? `need =<span class="v">${st.need}</span>` : '';
    $('map').innerHTML = st.map.length
      ? st.map.map(e => `<div class="kv ${e.k === st.hitK ? 'hit' : e.k === st.newK ? 'new' : ''}"><span>${e.k}</span><i>→</i><span>${e.v}</span></div>`).join('')
      : '<div class="empty">空</div>';
    $('status').textContent = st.msg;
    $('status').className = 'status ' + (st.kind || '');
    document.querySelectorAll('#code .l').forEach((el, k) => el.classList.toggle('on', k === st.line));
    $('count').textContent = `${cur + 1}/${steps.length}`;
    $('bar').style.width = `${(cur / (steps.length - 1)) * 100}%`;
    $('prev').disabled = cur === 0;
    $('next').disabled = cur === steps.length - 1;
    if (cur === steps.length - 1) stop();
  }

  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
  const stop = () => { clearInterval(timer); timer = null; $('play').innerHTML = PLAY; $('play').ariaLabel = '播放'; };
  const play = () => {
    if (cur === steps.length - 1) { cur = 0; render(); }
    $('play').innerHTML = PAUSE; $('play').ariaLabel = '暂停';
    timer = setInterval(() => { cur < steps.length - 1 ? (cur++, render()) : stop(); }, 1000);
  };

  function load(n, t) {
    stop();
    nums = n; target = t; steps = build(); cur = 0;
    $('numsIn').value = n.join(', '); $('tIn').value = t; $('field').classList.remove('bad');
    render();
  }

  // 示例分段切换
  const seg = $('seg');
  const setOn = k => seg.querySelectorAll('button').forEach((b, j) => b.classList.toggle('on', j === k));
  EXAMPLES.forEach(([n, t], k) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `例 ${k + 1}`;
    b.title = `[${n}], target = ${t}`;
    b.onclick = () => { setOn(k); load(n, t); };
    seg.appendChild(b);
  });
  setOn(0);

  // 自定义输入
  $('field').addEventListener('submit', e => {
    e.preventDefault();
    const n = $('numsIn').value.replace(/[\[\]]/g, '').split(/[,，\s]+/).filter(Boolean).map(Number);
    const t = Number($('tIn').value);
    const ok = n.length && n.length <= 10 && n.every(Number.isInteger) && Number.isInteger(t);
    $('field').classList.toggle('bad', !ok);
    if (!ok) return;
    setOn(-1);
    load(n, t);
  });

  $('code').innerHTML = CODE.map(c => `<span class="l">${c}</span>`).join('');
  $('prev').onclick = () => { stop(); cur > 0 && (cur--, render()); };
  $('next').onclick = () => { stop(); cur < steps.length - 1 && (cur++, render()); };
  $('reset').onclick = () => { stop(); cur = 0; render(); };
  $('play').onclick = () => (timer ? stop() : play());
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') $('next').click();
    else if (e.key === 'ArrowLeft') $('prev').click();
    else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  });

  load(...EXAMPLES[0]);
})();
</script>
</body>
</html>
